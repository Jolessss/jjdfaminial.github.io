<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <!-- Bootstrap 5 CSS (Start Bootstrap Standard) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
  <title>Assignment #2 - Income Tax Calculator</title>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-code-slash me-2 text-info"></i> IT-2C </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="assignment1.html">Assignment #1</a></li>
          <li class="nav-item"><a class="nav-link active text-info" href="assignment2.html">Assignment #2</a></li>
          <li class="nav-item"><a class="nav-link" href="assignment3.html">Assignment #3</a></li>
          <li class="nav-item"><a class="nav-link" href="assignment4.html">Assignment #4</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="card tool-card">
          <div class="card-header tool-card-header bg-assign-2 text-white">
            <i class="bi bi-calculator me-2"></i>Assignment #2: Income Tax Calculator
          </div>
          <div class="card-body p-4">
            <div class="mb-4">
              <label for="income" class="form-label fw-semibold">Taxable Income (PHP)</label>
              <div class="input-group input-group-lg">
                <span class="input-group-text">₱</span>
                <input type="number" class="form-control" id="income" placeholder="Enter taxable income" min="0" />
              </div>
            </div>
            <div class="d-grid gap-2 d-sm-flex mb-4">
              <button class="btn btn-success btn-lg px-4" onclick="computeTax()">Compute Income Tax</button>
              <a href="index.html" class="btn btn-outline-secondary btn-lg px-4">Back to Home</a>
            </div>
            <div class="alert alert-success mb-0 fs-6" id="taxResult">
              Enter your taxable income and click <strong>Compute Income Tax</strong>.
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center">
    <div class="container">
      <small>Project ni Faminial</small>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
