<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
  <title>Assignment #4 - Simple Payroll</title>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><i class="bi bi-code-slash me-2 text-info"></i> IT-2C </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarResponsive">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="assignment1.html">Assignment #1</a></li>
          <li class="nav-item"><a class="nav-link" href="assignment2.html">Assignment #2</a></li>
          <li class="nav-item"><a class="nav-link" href="assignment3.html">Assignment #3</a></li>
          <li class="nav-item"><a class="nav-link active text-info" href="assignment4.html">Assignment #4</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card tool-card">
          <div class="card-header tool-card-header bg-assign-4 text-white">
            <i class="bi bi-table me-2"></i>Assignment #4: Simple Payroll
          </div>
          <div class="card-body p-4">
            <div class="row g-3 mb-3">
              <div class="col-md-6">
                <label for="empName" class="form-label fw-semibold">Employee Name</label>
                <input type="text" class="form-control" id="empName" placeholder="Enter employee name" />
              </div>
              <div class="col-md-2">
                <label for="daysWorked" class="form-label fw-semibold">Days Worked</label>
                <input type="number" class="form-control" id="daysWorked" placeholder="0" min="0" />
              </div>
              <div class="col-md-2">
                <label for="dailyRate" class="form-label fw-semibold">Daily Rate</label>
                <input type="number" class="form-control" id="dailyRate" placeholder="0" min="0" />
              </div>
              <div class="col-md-2">
                <label for="deduction" class="form-label fw-semibold">Deduction</label>
                <input type="number" class="form-control" id="deduction" placeholder="0" min="0" />
              </div>
            </div>

            <div class="d-flex flex-wrap gap-2 align-items-center mb-4">
              <button class="btn btn-warning text-dark fw-bold" onclick="addEmployee()">
                <i class="bi bi-person-plus-fill me-1"></i>Add Employee
              </button>
              <div class="input-group" style="max-width: 240px;">
                <input type="number" class="form-control" id="deleteLine" placeholder="Line #" min="1" />
                <button class="btn btn-danger" onclick="deleteEmployee()">Delete Line</button>
              </div>
              <button class="btn btn-outline-danger" onclick="clearPayroll()">Clear All</button>
              <a href="index.html" class="btn btn-outline-secondary ms-auto">Back to Home</a>
            </div>

            <div class="table-responsive">
              <table class="table table-bordered table-striped table-hover align-middle text-center mb-0">
                <thead class="table-dark">
                  <tr>
                    <th>No.</th>
                    <th>Employee Name</th>
                    <th>Days Worked</th>
                    <th>Daily Rate</th>
                    <th>Gross Pay</th>
                    <th>Deduction</th>
                    <th>Net Pay</th>
                  </tr>
                </thead>
                <tbody id="payrollBody"></tbody>
                <tfoot class="table-warning fw-bold">
                  <tr>
                    <td colspan="4">TOTAL</td>
                    <td id="totalGross">0.00</td>
                    <td id="totalDed">0.00</td>
                    <td id="totalNet">0.00</td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center">
    <div class="container">
      <small>Project ni Faminial</small>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/scripts.js"></script>
</body>
</html>
